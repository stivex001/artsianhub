name: Mirror to Personal Repo

on:
  push:
    branches:
      - main 

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important for full history

      - name: Push to personal repo
        env:
          TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Add personal repo as remote
          git remote add personal https://$TOKEN@git@github.com:Folasayo-Samuel/artisan_frontend.git

          # Push everything (force to keep it identical)
          git push personal main --force
